<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/yleinen.css">
    <link rel="stylesheet" href="../css/tulokset.css">
    <script src="../javascript/front_end.js" defer></script>
    <title>Fuel To Fly</title>
</head>

<body>
    <header>
        <div class="logo_div">
            <img class="logo" src="../assets/Fuel_to_fly_logo.svg" alt="fuel To fly logo">
        </div>
    </header>

    <!-- Otsikko -->
    <div class="Tulokset_otsikko">
        <h1>Tulokset</h1>
    </div>

    <!-- Tulokset taulu -->
    <div class="Tulokset_Taulu">
        
        <!-- Eniten kenttiä -->
        <div class="Eniten_kenttiä">
            <div class="pokaali">
                <img src="../assets/Näyttökuva_2025-10-24_111217-removebg-preview 3.svg" alt="fuel To fly logo">
                <p>Eniten kenttiä </p>
            </div>

            <table class="Tulokset">
                <thead>
                    <tr>
                        <th>Pelaajan nimi</th>
                        <th>Kenttiä</th>
                        <th>Matka (km)</th>
                    </tr>
                </thead>
                <tbody id="Eniten_kenttiä-body">
                    <!-- Eniten kenttiä Tulostetaan tähän-->
                </tbody>
            </table>
        </div>

        <!-- Isoin matka -->
        <div class="Isoin_matka">
            <div class="pokaali">
                <img src="../assets/Näyttökuva_2025-10-24_111217-removebg-preview 3.svg" alt="fuel To fly logo">
                <p>Isoin matka</p>
                <table class="Tulokset">
                    <thead>
                        <tr>
                            <th>Pelaajan nimi</th>
                            <th>Kenttiä</th>
                            <th>Matka (km)</th>
                        </tr>
                    </thead>
                    <tbody id="Isoin_matka-body">
                         <!-- Isoin matka Tulostetaan tähän-->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Nappi pelaa alkuun -->
    <div class="central_div_tulos_Button" id="central_div_alku_sivu_Tulos">
        <div class="button_div">
            <a href="alku_sivu.html"><button id="tulokset">Etusivu</button></a>
        </div>
    </div>

    <footer>
    </footer>
</body>

</html>
